<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGiga Login</title>

  <!-- ── Core styles ── -->
  <link rel="stylesheet" href="css/core.css">

  <!-- ── Module styles ── -->
  <link rel="stylesheet" href="css/user-management.css">
  <link rel="stylesheet" href="css/roles.css">
  <link rel="stylesheet" href="css/hr.css">
  <link rel="stylesheet" href="css/payroll.css">
  <link rel="stylesheet" href="css/academics.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/students.css">
  <link rel="stylesheet" href="css/transport.css">
</head>
<body>
  <div class="login-box">
    <h2>School Management System</h2>
    <input type="email" id="email" placeholder="Email" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>

  <!-- ── Foundation (must load first) ── -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/dashboard.js"></script>

  <!-- ── Feature modules (order within this group does not matter) ── -->
  <script src="js/students.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/academics.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/payables.js"></script>
  <script src="js/eca-assignment.js"></script>
  <script src="js/journal-entries.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/finance-reports.js"></script>
  <script src="js/administration.js"></script>
  <script src="js/user-management.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/hr-list.js"></script>
  <script src="js/hr-add.js"></script>
  <script src="js/hr-edit.js"></script>
  <script src="js/hr-esp-form.js"></script>
  <script src="js/payroll.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/session-types.js"></script>
  <script src="js/api.js"></script>
</body>
</html>
