  <!-- ── Login page display type (Cormorant Garamond + Inter) ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ── Asset version ──────────────────────────────────────────────────────
       Every local css/js reference below carries ?v=<date><letter>. Vercel
       serves this HTML fresh but caches the assets, and nothing here is
       fingerprinted by a build step, so without a token a browser will keep
       running yesterday's js/*.js against today's index.html indefinitely —
       a shipped fix simply does not appear, with no error to notice.
       BUMP THE TOKEN ON EVERY DEPLOY THAT TOUCHES css/ OR js/. It must be
       identical across all of them; a mixed set loads a mixed build.
       parent-portal.html carries its own copy of the same token. -->

  <!-- ── Core styles ── -->
  <link rel="stylesheet" href="css/core.css?v=20260903d">
  <link rel="stylesheet" href="css/auth.css?v=20260903d">
